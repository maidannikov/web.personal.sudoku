name: container

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
  GITOPS_REPO_URL: ${{ vars.GITOPS_REPO_URL }}
  GITOPS_VALUES_FILE: sudoku/values.yaml

jobs:
  build-and-push:
    runs-on: sudoku-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate configuration
        env:
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          GITOPS_USERNAME: ${{ secrets.GITOPS_USERNAME }}
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          required_vars="IMAGE_REPOSITORY REGISTRY_HOST GITOPS_REPO_URL REGISTRY_USERNAME REGISTRY_PASSWORD GITOPS_USERNAME GITOPS_TOKEN"
          for name in $required_vars; do
            if [ -z "$(eval "printf '%s' \"\${$name}\"")" ]; then
              echo "Missing required Actions variable or secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Test
        run: npm test

      - name: Build static bundle
        run: npm run build

      - name: Set image tag
        run: echo "IMAGE_TAG=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build image
        run: docker build --tag "${IMAGE_REPOSITORY}:${IMAGE_TAG}" .

      - name: Log in to registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "${{ vars.REGISTRY_HOST }}" --username "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Push image
        run: docker push "${IMAGE_REPOSITORY}:${IMAGE_TAG}"

      - name: Update GitOps image tag
        env:
          GITOPS_USERNAME: ${{ secrets.GITOPS_USERNAME }}
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          GIT_AUTHOR_NAME: gitea-actions
          GIT_AUTHOR_EMAIL: gitea-actions@git.maidannikov.site
          GIT_COMMITTER_NAME: gitea-actions
          GIT_COMMITTER_EMAIL: gitea-actions@git.maidannikov.site
        run: |
          case "$GITOPS_REPO_URL" in
            http://*) gitops_clone_url="http://${GITOPS_USERNAME}:${GITOPS_TOKEN}@${GITOPS_REPO_URL#http://}" ;;
            https://*) gitops_clone_url="https://${GITOPS_USERNAME}:${GITOPS_TOKEN}@${GITOPS_REPO_URL#https://}" ;;
            *) echo "GITOPS_REPO_URL must start with http:// or https://" >&2; exit 1 ;;
          esac

          git clone "$gitops_clone_url" gitops

          cd gitops
          sed -i "/^image:/,/^[^ ]/ s/^  tag:.*/  tag: ${IMAGE_TAG}/" "${GITOPS_VALUES_FILE}"

          git add "${GITOPS_VALUES_FILE}"
          if git diff --cached --quiet; then
            echo "GitOps image tag is already ${IMAGE_TAG}"
            exit 0
          fi

          git commit -m "Update Sudoku image to ${IMAGE_TAG}"
          git push origin HEAD:main
