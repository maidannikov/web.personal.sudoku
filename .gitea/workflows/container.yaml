name: container

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
  GITOPS_REPO_URL: ${{ vars.GITOPS_REPO_URL }}
  GITOPS_VALUES_FILE: sudoku/values.yaml

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: npm test

      - name: Build static bundle
        run: npm run build

      - name: Install Docker CLI
        run: |
          apt-get update
          apt-get install -y docker.io
          docker --version

      - name: Set image tag
        run: echo "IMAGE_TAG=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build image
        run: docker build --tag "${IMAGE_REPOSITORY}:${IMAGE_TAG}" .

      - name: Log in to registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "${{ vars.REGISTRY_HOST }}" --username "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Push image
        run: docker push "${IMAGE_REPOSITORY}:${IMAGE_TAG}"

      - name: Update GitOps image tag
        env:
          GITOPS_USERNAME: ${{ secrets.GITOPS_USERNAME }}
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          GIT_AUTHOR_NAME: gitea-actions
          GIT_AUTHOR_EMAIL: gitea-actions@git.maidannikov.site
          GIT_COMMITTER_NAME: gitea-actions
          GIT_COMMITTER_EMAIL: gitea-actions@git.maidannikov.site
        run: |
          apt-get update
          apt-get install -y git

          repo_without_scheme="${GITOPS_REPO_URL#http://}"
          repo_without_scheme="${repo_without_scheme#https://}"
          git clone "http://${GITOPS_USERNAME}:${GITOPS_TOKEN}@${repo_without_scheme}" gitops

          cd gitops
          sed -i "/^image:/,/^[^ ]/ s/^  tag:.*/  tag: ${IMAGE_TAG}/" "${GITOPS_VALUES_FILE}"

          git add "${GITOPS_VALUES_FILE}"
          if git diff --cached --quiet; then
            echo "GitOps image tag is already ${IMAGE_TAG}"
            exit 0
          fi

          git commit -m "Update Sudoku image to ${IMAGE_TAG}"
          git push origin HEAD:main
